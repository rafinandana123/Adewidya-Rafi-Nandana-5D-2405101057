<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jelajahi katalog mobil CarFit.">
    <title>Katalog Mobil | CarFit</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar" id="siteNav"></header>

    <main>
        <section class="catalog-header">
            <div class="container">
                <span class="section-label">Katalog Mobil</span>
                <h1>Temukan mobil yang <span>sesuai kebutuhanmu.</span></h1>
                <p>Cari berdasarkan nama atau merek, lalu saring menurut tahun, kondisi, energi, dan harga.</p>
            </div>
        </section>

        <section class="catalog-section">
            <div class="container catalog-layout">
                <aside class="catalog-filter">
                    <div class="filter-header">
                        <h3>Filter Mobil</h3>
                        <button type="button" id="resetFilters">Reset</button>
                    </div>

                    <div class="filter-group">
                        <label for="carSearch">Cari mobil</label>
                        <input type="search" id="carSearch" placeholder="Nama atau merek...">
                    </div>

                    <div class="filter-group">
                        <label for="brand">Merek</label>
                        <select id="brand"></select>
                    </div>

                    <div class="filter-group">
                        <label for="year">Tahun</label>
                        <select id="year"></select>
                    </div>

                    <div class="filter-group">
                        <label for="condition">Kondisi</label>
                        <select id="condition">
                            <option value="">Semua Kondisi</option>
                            <option value="Baru">Baru</option>
                            <option value="Bekas">Bekas</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="energy">Jenis Energi</label>
                        <select id="energy">
                            <option value="">Semua Energi</option>
                            <option>Bensin</option>
                            <option>Diesel</option>
                            <option>Listrik</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label for="price">Harga Maksimal</label>
                        <select id="price">
                            <option value="">Semua Harga</option>
                            <option value="125000000">Rp125 Juta</option>
                            <option value="150000000">Rp150 Juta</option>
                            <option value="200000000">Rp200 Juta</option>
                            <option value="300000000">Rp300 Juta</option>
                        </select>
                    </div>
                </aside>

                <div class="catalog-content">
                    <div class="catalog-top">
                        <div>
                            <h2>Pilihan Mobil</h2>
                            <p id="catalogCount" aria-live="polite"></p>
                        </div>

                        <select class="sort-select" id="sortCars" aria-label="Urutkan kendaraan">
                            <option value="">Urutkan</option>
                            <option value="price-asc">Harga Terendah</option>
                            <option value="price-desc">Harga Tertinggi</option>
                            <option value="year-desc">Tahun Terbaru</option>
                        </select>
                    </div>

                    <div class="catalog-grid" id="catalogGrid"></div>
                    <div class="empty-state" id="emptyCatalog" hidden aria-live="polite"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer" id="siteFooter"></footer>

    <script src="js/main.js"></script>
</body>
</html>
