<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Analisis | CarFit</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-access="user">
    <header class="navbar" id="siteNav"></header>

    <main>
        <section class="dashboard-header">
            <div class="container">
                <div class="dashboard-welcome">
                    <div>
                        <span class="section-label">Riwayat</span>
                        <h1>Riwayat Analisis</h1>
                        <p>Setiap analisis tersimpan sebagai snapshot data, rincian, dan hasil. Hanya milik akun Anda.</p>
                    </div>

                    <button
                        type="button"
                        id="clearHistory"
                        class="btn btn-danger"
                        hidden
                    >Hapus Semua</button>
                </div>
            </div>
        </section>

        <section class="dashboard-section">
            <div class="container">
                <div id="historyList"></div>
            </div>
        </section>
    </main>

    <footer class="footer" id="siteFooter"></footer>

    <script src="js/main.js"></script>
</body>
</html>
